name: Deploy React to Cloud Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar React
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Publicar en Cloud Storage
        env:
          BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME }}
        run: |
          test -f dist/index.html
          gcloud storage rsync dist/ "gs://${BUCKET_NAME}" \
            --recursive \
            --cache-control="no-cache,max-age=0"
          gcloud storage ls "gs://${BUCKET_NAME}/index.html"